name: profile card

on:
  schedule:
    - cron: "30 0 * * *" # daily, 06:00 IST
  workflow_dispatch:
  push:
    paths: ["scripts/build_card.py", "assets/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build cards
        run: python scripts/build_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- dark_mode.svg light_mode.svg; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git commit -m "Update profile card stats"
          git push
